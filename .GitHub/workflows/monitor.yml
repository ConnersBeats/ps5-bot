name: Smyths PS5 Stock Check
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          pip install playwright requests
          playwright install chromium
      - name: Run Smyths Stock Check
        run: python check_smyths.py
